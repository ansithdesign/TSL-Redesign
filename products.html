<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TSL Products</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Twelve homepage directions for Training Solutions. Content is identical in each; palette, type, layout, components and motion change per direction. Hash picks the design: #c #e #g #h #j #p #q #r #s #t #v #w. */
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--page, #fff); transition: background .4s; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; }
ul { list-style: none; padding: 0; }
figure { margin: 0; }

:where(#app) {
  --page: #fff; --bg: #fff; --ink: #111; --mu: #555; --ln: rgba(0,0,0,.12); --ac: #1D68D8; --af: #fff; --ai: #1D68D8; --at: #E6EEFA; --pa: #F3F5F8; --cd: #fff;
  --fd: system-ui, sans-serif; --fb: system-ui, sans-serif; --fm: ui-monospace, Menlo, monospace;
  --wd: 500; --ls: -.035em; --h1: clamp(42px, 6vw, 88px); --h2: clamp(30px, 3.7vw, 54px);
  --r: 22px; --rs: 12px; --rb: 999px; --icw: 1.6; --cap: round; --join: round;
  --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip; position: relative;
}
.wrap { max-width: 1280px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); position: relative; }
h1, h2, h3, h4 { font-family: var(--fd); font-weight: var(--wd); letter-spacing: var(--ls); text-wrap: balance; line-height: 1.04; }
h1 { font-size: var(--h1); }
h2 { font-size: var(--h2); }
h3 { letter-spacing: -.02em; line-height: 1.2; }
em { font-style: normal; }
p { text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--focus, var(--ac)); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--at); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* icons: one stroke set; weight, caps and joins change per design */
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: var(--icw); stroke-linecap: var(--cap); stroke-linejoin: var(--join); flex: none; display: block; }
svg.lm { fill: currentColor; stroke: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 22px; border-radius: var(--rb); font: 600 14px/1 var(--fb); border: 1px solid transparent; background: var(--ac); color: var(--af); cursor: pointer; white-space: nowrap; transition: transform .3s cubic-bezier(.2,.8,.2,1), background .25s, color .25s, border-color .25s, box-shadow .3s; }
.btn:hover { transform: translateY(-2px); }
.btn .i { font-size: 15px; transition: transform .3s; }
.btn:hover .i { transform: translateX(3px); }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; }

/* ===== header bar ===== */
.hd { position: relative; }
.barh { position: relative; z-index: 40; height: var(--barh, 88px); }
.bar { position: absolute; left: 0; right: 0; top: 0; color: var(--bar-fg, var(--ink)); transition: transform .45s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; }
.bar-in { position: relative; height: var(--barh, 88px); display: flex; align-items: center; gap: 22px; }
.bar.stuck { position: fixed; padding-top: env(safe-area-inset-top, 0px); background: var(--bar-sbg, var(--bg)); color: var(--bar-sfg, var(--ink)); box-shadow: 0 1px 0 var(--ln), 0 18px 40px -30px rgba(0,0,0,.35); animation: barIn .45s cubic-bezier(.2,.8,.2,1); }
.bar.stuck .bar-in { height: 70px; }
.bar.away { transform: translateY(-115%); }
@keyframes barIn { from { transform: translateY(-100%); } }
.logo { display: inline-flex; align-items: center; gap: 11px; font-family: var(--fd); font-weight: var(--logo-w, 600); font-size: 18px; letter-spacing: -.025em; white-space: nowrap; flex: none; }
.logo .lm { width: 27px; height: 26px; color: var(--logo-c, currentColor); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.logo:hover .lm { transform: none; }
.nv { display: flex; align-items: center; gap: 2px; margin-inline: auto; }
.nv-i { position: relative; }
.nv-i.mega { position: static; }
.nv-b { font: 500 14px var(--fb); color: inherit; background: none; border: 0; padding: 10px 14px; border-radius: var(--rb); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; position: relative; transition: background .25s, color .25s; }
.nv-b .i { font-size: 12px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.nv-i.open > .nv-b .i { transform: rotate(180deg); }
.nav-soft .nv-b:hover, .nav-soft .nv-i.open > .nv-b { background: var(--nv-hv, rgba(127,127,127,.16)); }
.nav-line .nv-b::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.nav-line .nv-b:hover::after, .nav-line .nv-i.open > .nv-b::after { transform: scaleX(1); transform-origin: left; }
.bar-end { display: flex; align-items: center; gap: 8px; flex: none; }
.b-login { font-weight: 500; font-size: 14px; padding: 10px 14px; border-radius: var(--rb); transition: background .25s; }
.b-login:hover { background: var(--nv-hv, rgba(127,127,127,.16)); }
.b-cart { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 8px 0 18px; border-radius: var(--rb); background: var(--cart-bg, var(--ac)); color: var(--cart-fg, var(--af)); font-weight: 600; font-size: 14px; transition: transform .3s; }
.b-cart:hover { transform: translateY(-1px); }
.b-cart b { min-width: 28px; height: 28px; padding: 0 8px; border-radius: var(--rb); background: var(--cart-n, rgba(255,255,255,.22)); display: inline-grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.burger { display: none; width: 44px; height: 44px; border-radius: var(--rb); border: 1px solid currentColor; background: none; cursor: pointer; place-items: center; font-size: 18px; }

/* menus */
.pn { position: absolute; top: calc(100% + 8px); z-index: 60; background: var(--mm-bg, #fff); color: var(--mm-fg, #111); border: 1px solid var(--mm-ln, rgba(0,0,0,.1)); border-radius: var(--mm-r, var(--r)); box-shadow: 0 40px 80px -30px rgba(8,16,40,.35), 0 2px 6px rgba(8,16,40,.06); visibility: hidden; opacity: 0; transform: translateY(-8px) scale(.985); transform-origin: top center; transition: opacity .22s, transform .35s cubic-bezier(.2,.8,.2,1), visibility 0s .35s; text-align: left; }
.pn::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; }
.nv-i.open > .pn { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
.dd { left: 0; min-width: 280px; padding: 8px; }
.dd a { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 12px; border-radius: calc(var(--mm-r, var(--r)) * .55); font-size: 14px; font-weight: 500; line-height: 1.3; transition: background .2s, padding .3s; }
.dd a .i { opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .3s; font-size: 14px; color: var(--mm-ac, var(--ac)); }
.dd a:hover, .dd a:focus-visible { background: var(--mm-hv, rgba(0,0,0,.05)); }
.dd a:hover .i, .dd a:focus-visible .i { opacity: 1; transform: none; }

.mm { left: var(--gl); right: var(--gr); padding: 26px; display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 28px; }
.mm-h { font: 600 11px var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--mm-mu, #666); margin-bottom: 12px; }
.mm-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; }
.mm-c { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 9px 10px; border-radius: calc(var(--mm-r, var(--r)) * .5); font-size: 14px; font-weight: 500; line-height: 1.3; transition: background .2s, color .2s; }
.mm-c:hover, .mm-c:focus-visible { background: var(--mm-hv, rgba(0,0,0,.05)); }
.mm-c .ti { display: none; }
.mm-n { order: 0; min-width: 0; }
.mm-k { order: 1; font: 500 12px var(--fm); color: var(--mm-mu, #666); font-variant-numeric: tabular-nums; }
.mm-bar { display: none; order: 2; }
.mm-side { border-left: 1px solid var(--mm-ln, rgba(0,0,0,.1)); padding-left: 26px; display: flex; flex-direction: column; gap: 8px; }
.mm-side .mm-h:not(:first-child) { margin-top: 12px; }
.mm-box { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; border: 1px solid var(--mm-ln, rgba(0,0,0,.1)); border-radius: calc(var(--mm-r, var(--r)) * .55); font-weight: 500; font-size: 14px; line-height: 1.3; transition: background .25s, border-color .25s, color .25s; }
.mm-box .i { transition: transform .3s; }
.mm-box:hover { background: var(--mm-ac, var(--ac)); border-color: var(--mm-ac, var(--ac)); color: var(--mm-af, var(--af)); }
.mm-box:hover .i { transform: translateX(3px); }
.mm-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; border-top: 1px solid var(--mm-ln, rgba(0,0,0,.1)); padding-top: 16px; }
.mm-foot a { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.mm-foot a .i { transition: transform .3s; }
.mm-foot a:hover .i { transform: translateX(4px); }
.mm-pv { display: none; }

/* mega: proportional bars */
.mm-bars .mm-bar { display: block; grid-column: 1 / -1; height: 3px; border-radius: 3px; background: var(--mm-track, rgba(0,0,0,.07)); position: relative; overflow: hidden; }
.mm-bars .mm-bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--n) / 19 * 100%); background: var(--mm-ac, var(--ac)); border-radius: inherit; transform: scaleX(0); transform-origin: left; transition: transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 30ms); }
.nv-i.open .mm-bars .mm-bar::after { transform: scaleX(1); }
/* mega: icon tiles */
.mm-tiles .mm-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mm-tiles .mm-c { grid-template-columns: auto minmax(0, 1fr); padding: 10px; }
.mm-tiles .mm-c .ti { display: grid; place-items: center; grid-row: span 2; width: 40px; height: 40px; border-radius: calc(var(--mm-r, var(--r)) * .45); background: var(--mm-tile, rgba(0,0,0,.05)); color: var(--mm-ac, var(--ac)); font-size: 19px; transition: transform .35s cubic-bezier(.2,.8,.2,1), background .25s, color .25s; }
.mm-tiles .mm-c:hover .ti { transform: rotate(-8deg) scale(1.06); background: var(--mm-ac, var(--ac)); color: var(--mm-af, #fff); }
.mm-tiles .mm-k { order: 1; font-size: 11.5px; }
/* mega: ledger with dotted leaders */
.mm-ledger .mm-c { grid-template-columns: auto minmax(12px, 1fr) auto; }
.mm-ledger .mm-bar { display: block; order: 1; align-self: end; margin-bottom: 5px; border-bottom: 1.5px dotted var(--mm-mu, #888); opacity: .5; }
.mm-ledger .mm-k { order: 2; }
/* mega: list with a live preview pane */
.mm-preview { grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, 1fr); }
.mm-preview .mm-pv { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; border-radius: calc(var(--mm-r, var(--r)) * .7); background: var(--mm-pvbg, #111); color: var(--mm-pvfg, #fff); padding: 22px; min-height: 280px; position: relative; overflow: hidden; }
.mm-pv .pv-k { font: var(--wd) clamp(64px, 7vw, 108px)/.86 var(--fd); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.mm-pv .pv-n { font: 500 18px/1.2 var(--fd); letter-spacing: -.02em; }
.mm-pv .pv-u { font: 500 12px var(--fm); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.mm-pv .pv-ic { position: absolute; right: 18px; top: 18px; font-size: 26px; opacity: .8; }
.mm-pv.flip .pv-k, .mm-pv.flip .pv-n { animation: pvIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes pvIn { from { opacity: 0; transform: translateY(10px); } }
.mm-preview .mm-list { grid-template-columns: 1fr 1fr; }
.mm-preview .mm-c[aria-current="true"] { background: var(--mm-hv, rgba(0,0,0,.05)); }
/* mega: count bubbles */
.mm-bubbles .mm-list { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.mm-bubbles .mm-c { display: inline-flex; gap: 10px; border: 1px solid var(--mm-ln, rgba(0,0,0,.12)); border-radius: 999px; padding: 6px 6px 6px 16px; }
.mm-bubbles .mm-k { order: 1; min-width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--mm-tile, #eee); color: var(--mm-fg); font-weight: 600; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.mm-bubbles .mm-c:hover { background: var(--mm-ac); color: var(--mm-af); border-color: var(--mm-ac); }
.mm-bubbles .mm-c:hover .mm-k { transform: scale(1.18); }
/* mega: large type list */
.mm-type .mm-list { gap: 0 28px; }
.mm-type .mm-c { padding: 8px 4px; border-radius: 0; border-bottom: 1px solid var(--mm-ln); font: 300 19px/1.2 var(--fd); letter-spacing: -.02em; }
.mm-type .mm-k { font: italic 300 15px var(--fd); color: var(--mm-ac); align-self: start; }
.mm-type .mm-c:hover { background: none; padding-left: 12px; }
.mm-type .mm-c { transition: padding .35s cubic-bezier(.2,.8,.2,1); }

/* mobile drawer */
.drawer { position: fixed; inset: 0; z-index: 300; background: var(--dr-bg, var(--bg)); color: var(--dr-fg, var(--ink)); overflow: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) calc(40px + env(safe-area-inset-bottom, 0px)) var(--gl); clip-path: circle(0 at calc(100% - 42px) 42px); visibility: hidden; transition: clip-path .6s cubic-bezier(.7,0,.2,1), visibility 0s .6s; }
.drawer.open { clip-path: circle(150% at calc(100% - 42px) 42px); visibility: visible; transition-delay: 0s; }
.dr-h { display: flex; justify-content: space-between; align-items: center; height: 60px; }
.drawer details { border-bottom: 1px solid var(--ln); }
.drawer summary { list-style: none; cursor: pointer; padding: 18px 2px; font: var(--wd) 24px/1.1 var(--fd); letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: center; }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary .i { font-size: 16px; transition: transform .3s; }
.drawer details[open] summary .i { transform: rotate(180deg); }
.drawer details a { display: flex; justify-content: space-between; padding: 10px 2px 10px 12px; font-size: 15px; }
.drawer details a span { color: var(--mu); font-family: var(--fm); font-size: 12px; }
.drawer .mm-h { padding-left: 12px; margin: 12px 0 4px; color: var(--mu); }
.dr-login { display: block; margin-top: 24px; text-align: center; padding: 15px; border-radius: var(--rb); border: 1px solid currentColor; font-weight: 600; }

/* hero search */
.sub { margin-top: 22px; font-size: clamp(16px, 1.25vw, 18px); line-height: 1.55; max-width: 46ch; color: var(--sub-c, var(--mu)); }
.hs { margin-top: 32px; width: min(580px, 100%); }
.hs-f { display: flex; align-items: center; gap: 10px; background: var(--hs-bg, #fff); color: var(--hs-fg, var(--ink)); border: 1px solid var(--hs-ln, var(--ln)); border-radius: var(--hs-r, var(--rb)); padding: 7px 7px 7px 20px; box-shadow: var(--hs-sh, 0 24px 50px -28px rgba(0,0,0,.35)); transition: box-shadow .3s, transform .3s, border-color .3s; }
.hs-f:focus-within { border-color: var(--hs-ring, var(--ac)); transform: translateY(-1px); }
.hs-f > .i { font-size: 19px; opacity: .65; }
.hs-f input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; color: inherit; padding: 11px 0; outline: none; }
.hs-f input::placeholder { color: inherit; opacity: .55; }
.hs-f input::-webkit-search-cancel-button { display: none; }
.hs-b { min-height: 44px; background: var(--hs-btn, var(--ac)); color: var(--hs-btnf, var(--af)); border-radius: calc(var(--hs-r, var(--rb)) - 3px); }
.hs-pop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; }
.hs-pop span { opacity: .72; margin-right: 4px; }
.hs-pop a { padding: 6px 13px; border: 1px solid var(--pop-ln, rgba(127,127,127,.45)); border-radius: var(--rb); transition: background .25s, color .25s, border-color .25s; }
.hs-pop a:hover { background: var(--pop-hv, var(--ink)); color: var(--pop-hvf, var(--bg)); border-color: var(--pop-hv, var(--ink)); }

/* photos */
.ph { position: relative; overflow: hidden; background: var(--ph-bg, var(--at)); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.top img { object-position: 50% 20%; }

/* split-word headline */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.wi { display: inline-block; animation: wUp 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 70ms + 120ms); }
@keyframes wUp { from { transform: translateY(110%); } }
.fade-up { animation: fUp 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--dl, .3s); }
@keyframes fUp { from { opacity: 0; transform: translateY(18px); } }

/* rotating badge */
.badge { position: absolute; width: 128px; height: 128px; z-index: 4; }
.badge svg { width: 100%; height: 100%; animation: spin 28s linear infinite; }
.badge circle { fill: var(--bd-bg, var(--ac)); }
.badge text { fill: var(--bd-fg, var(--af)); font: 600 9.2px var(--fm); letter-spacing: .08em; }
.badge .core { position: absolute; inset: 30px; border-radius: 50%; background: var(--bd-core, var(--hl, #fff)); color: var(--bd-corefg, var(--ink)); display: grid; place-items: center; font: 700 14px var(--fd); letter-spacing: -.02em; }
@keyframes spin { to { transform: rotate(360deg); } }

/* sections */
.sx { padding-block: var(--sp, 76px); position: relative; }
.sh { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px 48px; flex-wrap: wrap; margin-bottom: var(--shm, 52px); }
.sh > div { max-width: 680px; min-width: 0; }
.sh p { margin-top: 16px; color: var(--mu); font-size: 16px; max-width: 54ch; }
.more-l { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.more-l .ic { width: 42px; height: 42px; border-radius: var(--rb); border: 1px solid var(--ln); display: grid; place-items: center; font-size: 16px; transition: background .3s, color .3s, border-color .3s, transform .4s cubic-bezier(.2,.8,.2,1); }
.more-l:hover .ic { background: var(--ac); color: var(--af); border-color: var(--ac); transform: rotate(-45deg); }
.ar-d .more-l:hover .ic { transform: rotate(45deg); }

/* reveal on scroll (only for blocks below the first screen) */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }


@media (max-width: 1060px) {
  .nv, .b-login { display: none; }
  .burger { display: inline-grid; }
  .bar-end { margin-left: auto; }
}
@media (max-width: 720px) {
  .sx { padding-block: var(--sp-m, 48px); }
  .sh { margin-bottom: 34px; }
  .b-cart { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .rv { opacity: 1; transform: none; }
}
</style>
<style>
.sx { color: var(--ink); scroll-margin-top: 70px; }
main .sx:not(.trust) { background: var(--sbg, transparent); }

/* ===== partners ===== */
.trust { --sp: 60px; }
.tr-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.5fr); gap: 28px 64px; align-items: center; }
.since { font-family: var(--fd); font-size: clamp(20px, 1.8vw, 26px); font-weight: var(--wd); letter-spacing: -.025em; line-height: 1.15; max-width: 17ch; text-wrap: balance; }
.plab { font: 600 11px var(--fm); letter-spacing: .12em; text-transform: uppercase; color: var(--mu); margin-bottom: 18px; }
.logos { display: flex; align-items: center; justify-content: space-between; gap: 24px 40px; flex-wrap: wrap; }
.logos li { display: flex; align-items: center; }
.logos img { height: 36px; width: auto; filter: grayscale(1); opacity: .66; mix-blend-mode: multiply; transition: filter .4s, opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
.logos li:hover img { filter: none; opacity: 1; transform: translateY(-3px); }

/* ===== categories ===== */
.tl { position: relative; }
.t { position: relative; color: var(--ink); }
.t .ti { display: grid; place-items: center; font-size: 20px; }
.t .tc b { font-weight: inherit; }
.ta { display: grid; place-items: center; font-size: 16px; transition: transform .4s cubic-bezier(.2,.8,.2,1); }

/* pills */
.v-pills .tl { display: flex; flex-wrap: wrap; gap: 10px; }
.v-pills .t { display: inline-flex; align-items: center; gap: 12px; padding: 8px 18px 8px 8px; border-radius: var(--rb); background: var(--t-bg, var(--cd)); border: 1px solid var(--t-ln, var(--ln)); font-weight: 500; font-size: clamp(15px, 1.25vw, 18px); line-height: 1.2; transition: background .35s, color .35s, border-color .35s, transform .45s cubic-bezier(.3,1.4,.5,1); }
.v-pills .ti { width: 42px; height: 42px; border-radius: 50%; background: var(--at); color: var(--ai); transition: background .35s, color .35s, transform .5s cubic-bezier(.3,1.4,.5,1); }
.v-pills .tc { font-size: 0; }
.v-pills .tc b { font: 500 12px var(--fm); color: var(--mu); vertical-align: super; transition: color .3s; }
.v-pills .ta { width: 0; opacity: 0; overflow: hidden; margin-left: -6px; transition: width .4s cubic-bezier(.2,.8,.2,1), opacity .3s, margin .4s; }
.v-pills .t:hover { background: var(--ac); color: var(--af); border-color: var(--ac); transform: translateY(-3px); }
.v-pills .t:hover .ti { background: rgba(255,255,255,.2); color: inherit; transform: rotate(-12deg); }
.v-pills .t:hover .tc b { color: inherit; }
.v-pills .t:hover .ta { width: 18px; opacity: 1; margin-left: 0; }
.v-pills .t.more { background: var(--ink); color: var(--bg); border-color: var(--ink); padding-left: 22px; }
.v-pills .t.more .ta { width: 18px; opacity: 1; margin-left: 0; }

/* bento */
.v-bento .tl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; gap: 12px; }
.v-bento .t { min-height: 178px; border-radius: var(--r); padding: 22px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 8px 12px; overflow: hidden; transition: transform .5s cubic-bezier(.3,1.4,.5,1), box-shadow .4s; }
.v-bento .t:nth-child(-n+5) { grid-column: span 2; }
.v-bento .ti { grid-column: 1; width: 52px; height: 52px; border-radius: 16px; font-size: 26px; background: rgba(255,255,255,.18); }
.v-bento .tc { grid-column: 2; grid-row: 1; font-size: 13px; font-weight: 600; white-space: nowrap; }
.v-bento .tn { grid-column: 1 / -1; grid-row: 3; font: var(--wd) clamp(19px, 1.7vw, 24px)/1.08 var(--fd); letter-spacing: -.02em; max-width: 16ch; }
.v-bento .ta { grid-row: 2; grid-column: 2; align-self: end; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.18); opacity: 0; transform: scale(.4) rotate(-45deg); transition: opacity .3s, transform .5s cubic-bezier(.3,1.5,.5,1); }
.v-bento .t:hover { transform: translateY(-6px) rotate(-.6deg); }
.v-bento .t:hover .ta { opacity: 1; transform: none; }
.v-bento .t:nth-child(-n+5) .tc b { font: var(--wd) 54px/1 var(--fd); display: block; letter-spacing: -.04em; }
.v-bento .t.more { grid-template-rows: 1fr auto; }
.v-bento .t.more .ta { opacity: 1; transform: none; grid-row: 2; }
.v-bento .t.more .tn { grid-row: 1; align-self: start; }

/* index */
.v-index .tl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; border-top: 1px solid var(--ink); }
.v-index .t { display: grid; grid-template-columns: 64px minmax(0, 1fr) 28px; align-items: center; gap: 16px; padding: 19px 6px; border-bottom: 1px solid var(--ln); overflow: hidden; isolation: isolate; transition: color .35s, padding .45s cubic-bezier(.2,.8,.2,1); }
.v-index .t::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink); transform: scaleY(0); transform-origin: bottom; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.v-index .ti { display: none; }
.v-index .tc { grid-column: 1; grid-row: 1; font-size: 0; }
.v-index .tc b { font: 400 13px var(--fm); color: var(--mu); transition: color .3s; }
.v-index .tn { grid-column: 2; grid-row: 1; font: var(--wd) clamp(18px, 1.6vw, 22px)/1.2 var(--fd); letter-spacing: -.02em; }
.v-index .ta { grid-column: 3; grid-row: 1; transform: translateX(-10px); opacity: 0; transition: transform .45s, opacity .3s; }
.v-index .t:hover { color: var(--bg); padding-left: 18px; }
.v-index .t:hover::before { transform: none; }
.v-index .t:hover .tc b { color: inherit; }
.v-index .t:hover .ta { transform: none; opacity: 1; }
.v-index .t.more { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) 28px; }
.v-index .t.more .tn { grid-column: 1; }
.v-index .t.more .ta { grid-column: 2; opacity: 1; transform: none; }

/* ledger */
.v-ledger .tl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 64px; }
.v-ledger .t { display: grid; grid-template-columns: 30px minmax(0, auto) minmax(20px, 1fr) auto 22px; align-items: baseline; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--ln); }
.v-ledger .ti { font-size: 20px; color: var(--ai); align-self: center; transition: transform .5s; }
.v-ledger .tn { font: var(--wd) clamp(18px, 1.55vw, 22px)/1.25 var(--fd); letter-spacing: -.015em; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.v-ledger .t::after { content: ""; grid-column: 3; grid-row: 1; align-self: end; margin-bottom: .45em; border-bottom: 2px dotted var(--mu); opacity: .45; transition: opacity .3s, border-color .3s; }
.v-ledger .tc { grid-column: 4; grid-row: 1; font: 500 13px var(--fm); color: var(--mu); white-space: nowrap; font-variant-numeric: tabular-nums; }
.v-ledger .ta { grid-column: 5; grid-row: 1; align-self: center; font-size: 15px; opacity: .3; transition: opacity .3s, transform .4s; }
.v-ledger .t:hover .tn { transform: translateX(8px); }
.v-ledger .t:hover::after { opacity: 1; border-bottom-style: solid; border-color: var(--ink); }
.v-ledger .t:hover .ta { opacity: 1; transform: rotate(45deg); }
.v-ledger .t:hover .ti { transform: rotate(-15deg) scale(1.1); }
.v-ledger .t.more { grid-template-columns: minmax(0, auto) minmax(20px, 1fr) 22px; }
.v-ledger .t.more::after { grid-column: 2; }
.v-ledger .t.more .tn { font-weight: 600; }
.v-ledger .t.more .ta { grid-column: 3; opacity: 1; }

/* tiles */
.v-tiles .tl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--ln); border: 1px solid var(--ln); border-radius: var(--r); overflow: hidden; }
.v-tiles .t { background: var(--cd); padding: 20px; min-height: 164px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; transition: background .3s, color .3s; }
.v-tiles .ti { width: 40px; height: 40px; border-radius: var(--rs); background: var(--pa); color: var(--ai); transition: background .3s, color .3s; }
.v-tiles .tn { font: 500 15.5px/1.25 var(--fd); letter-spacing: -.01em; align-self: start; }
.v-tiles .tc { display: block; font: 500 11.5px var(--fm); color: var(--mu); }
.v-tiles .ta { position: absolute; right: 16px; top: 18px; opacity: 0; transform: translate(-6px, 6px); transition: opacity .3s, transform .4s; color: var(--ai); }
.v-tiles .t:hover { background: var(--pa); }
.v-tiles .t:hover .ti { background: var(--ink); color: #fff; }
.v-tiles .t:hover .ta { opacity: 1; transform: none; }
.v-tiles .t.more { background: var(--ink); color: #fff; grid-template-rows: 1fr auto; }
.v-tiles .t.more .tn { font-size: 18px; align-self: end; }
.v-tiles .t.more .ta { position: static; opacity: 1; transform: none; justify-self: start; color: var(--hl); font-size: 20px; }

/* cards */
.v-cards .tl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.v-cards .t { display: flex; flex-direction: column; gap: 18px; min-height: 196px; padding: 20px; background: var(--t-bg, var(--cd)); border: 1px solid var(--t-ln, var(--ln)); border-radius: var(--r); transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s, background .3s, color .3s; }
.v-cards .ti { width: 46px; height: 46px; border-radius: calc(var(--r) * .6); background: var(--at); color: var(--ai); font-size: 22px; transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
.v-cards .tn { font: 600 16.5px/1.22 var(--fd); letter-spacing: -.02em; }
.v-cards .tc { margin-top: auto; font-size: 13px; color: var(--mu); }
.v-cards .ta { position: absolute; right: 18px; bottom: 18px; width: 34px; height: 34px; border-radius: 50%; background: var(--pa); color: var(--ink); transition: transform .45s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; }
.v-cards .t:hover { transform: translateY(-6px); box-shadow: 0 28px 50px -28px rgba(0,0,0,.35); }
.v-cards .t:hover .ti { transform: scale(1.08) rotate(-8deg); }
.v-cards .t:hover .ta { background: var(--ac); color: var(--af); transform: rotate(-45deg); }
.v-cards .t.more { background: transparent; border-style: dashed; justify-content: space-between; }
.v-cards .t.more .tn { font-size: 19px; }

/* bubbles: circle size follows the product count */
.v-bubbles .tl { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
.v-bubbles .t { --sz: calc(118px + var(--n) * 6.4px); width: var(--sz); height: var(--sz); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 16px; background: var(--b, var(--pa)); color: var(--bf, var(--ink)); transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
.v-bubbles .ti { font-size: calc(16px + var(--n) * .6px); }
.v-bubbles .tn { font: 600 calc(12.5px + var(--n) * .3px)/1.12 var(--fd); letter-spacing: -.02em; max-width: 13ch; }
.v-bubbles .tc { font-size: 12px; opacity: .8; }
.v-bubbles .ta { display: none; }
.v-bubbles .t:hover { transform: scale(1.08) rotate(-4deg); }
.v-bubbles .t.more { --sz: 150px; }
.v-bubbles .t.more .ta { display: grid; font-size: 22px; }

/* hairline grid */
.v-hair .tl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ln); border-left: 1px solid var(--ln); }
.v-hair .t { border-right: 1px solid var(--ln); border-bottom: 1px solid var(--ln); padding: 26px 22px 22px; min-height: 186px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; isolation: isolate; transition: color .4s; }
.v-hair .t::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--at), transparent); opacity: 0; transition: opacity .5s; }
.v-hair .ti { justify-content: start; font-size: 28px; color: var(--ai); }
.v-hair .tn { font: 300 18px/1.25 var(--fd); letter-spacing: -.01em; }
.v-hair .tc { margin-top: auto; font: 400 11.5px var(--fm); letter-spacing: .04em; color: var(--mu); }
.v-hair .ta { position: absolute; right: 18px; top: 22px; opacity: 0; transform: translate(-8px, 8px); transition: opacity .3s, transform .45s; color: var(--ai); }
.v-hair .t:hover::before { opacity: 1; }
.v-hair .t:hover .ta { opacity: 1; transform: none; }
.v-hair .t.more { background: var(--ink); color: #fff; justify-content: flex-end; }
.v-hair .t.more .ta { opacity: 1; transform: none; color: #fff; }

/* ===== welcome ===== */
.wg { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(40px, 7vw, 104px); align-items: center; }
.wph { position: relative; padding: 0 28px 28px 0; }
.wph::before { content: ""; position: absolute; right: 0; bottom: 0; width: 82%; height: 82%; background: var(--w-blk, var(--ac)); border-radius: var(--r); }
.wpf { position: relative; aspect-ratio: 4 / 4.4; border-radius: var(--r); overflow: hidden; background: #DCE7EA; }
.wpf img { object-position: 50% 28%; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.wph:hover .wpf img { transform: scale(1.04); }
.wh { font-size: clamp(28px, 3.2vw, 46px); max-width: 15ch; }
.wc { margin-top: 22px; color: var(--mu); max-width: 60ch; }
.wsig { margin-top: 18px; font-weight: 600; }
.cat { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--ln); display: flex; align-items: center; gap: 16px 26px; flex-wrap: wrap; }
.cat-m { display: flex; flex-direction: column; gap: 4px; }
.cat-t { font: 700 23px/1 var(--fd); letter-spacing: -.04em; }
.cat-t i { font-style: normal; color: var(--cat-c, #0072B5); }
.cat-s { font-size: 13px; }
.cat-s b { color: var(--cat-c, #0072B5); }
.cat-l { height: 24px; width: auto; }
.cat-a { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
.cat-a .i { transition: transform .35s; }
.cat-a:hover .i { transform: translateX(4px); }
.cat-c { flex-basis: 100%; font-size: 12px; color: var(--mu); }
.wl-card .wtop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--cd); border: 1px solid var(--ln); border-radius: calc(var(--r) * 1.2); overflow: hidden; }
.wl-card .wpf { aspect-ratio: auto; min-height: 460px; border-radius: 0; }
.wl-card .wt { padding: clamp(32px, 5.5vw, 76px); display: grid; align-content: center; }
.wrib { margin-top: 14px; background: var(--rib, var(--ink)); color: #fff; border-radius: var(--r); padding: 26px 36px; }
.wrib .cat { margin: 0; padding: 0; border: 0; justify-content: space-between; }
.wrib .cat-t i, .wrib .cat-s b { color: inherit; }
.wrib .cat-c { flex-basis: auto; color: rgba(255,255,255,.72); order: 3; }
.wrib .cat-a { order: 4; border: 0; background: #fff; color: var(--rib, var(--ink)); padding: 13px 20px; border-radius: var(--rb); }
.wl-letter .wg { grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); align-items: start; }
.wl-letter .wpf { width: 200px; aspect-ratio: 4 / 3; border-radius: var(--rs); margin-bottom: 30px; }
.wl-letter .wh { max-width: 18ch; }
.promo { background: #fff; border-radius: var(--r); padding: 34px 30px; display: grid; justify-items: center; gap: 18px; text-align: center; color: #0B1020; position: sticky; top: 100px; box-shadow: 0 30px 60px -36px rgba(0,0,0,.4); }
.promo img { width: min(100%, 300px); }
.promo .cat-c { color: #5A6275; }

/* ===== courses ===== */
.sh-r { display: flex; align-items: center; gap: 16px; }
.c { display: flex; flex-direction: column; position: relative; color: var(--ink); }
.cv { position: relative; aspect-ratio: 4 / 4.3; border-radius: var(--r); background: var(--cv-bg, var(--pa)); display: flex; align-items: center; justify-content: center; padding: 13% 18% 15%; perspective: 900px; isolation: isolate; }
.cv::after { content: ""; position: absolute; left: 26%; right: 26%; bottom: 9%; height: 18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.24), transparent); z-index: -1; transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s; }
.bk { display: block; height: 100%; transition: transform .7s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.bk img { height: 100%; width: auto; max-width: 100%; object-fit: contain; mix-blend-mode: multiply; }
.c:hover .bk { transform: translateY(-8px) rotate(-2deg); }
.c:hover .cv::after { transform: scaleX(.8); opacity: .6; }
.cc { position: absolute; left: 14px; top: 14px; z-index: 2; font: 500 11px var(--fm); letter-spacing: .06em; padding: 5px 9px; border-radius: var(--rb); background: var(--cd); color: var(--ink); }
.cb { padding: 18px 4px 0; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.ct { font: 600 11px var(--fm); letter-spacing: .07em; text-transform: uppercase; color: var(--ai); }
.c h3 { font: var(--c-w, 500) 17px/1.26 var(--fd); letter-spacing: -.015em; }
.cf { margin-top: auto; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.price { font: 600 18px var(--fd); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 7px; }
.was { font-size: .74em; font-weight: 400; opacity: .55; text-decoration-thickness: 1px; }
.go { display: inline-flex; align-items: center; height: 38px; padding: 0 11px; border-radius: var(--rb); background: var(--go-bg, var(--ac)); color: var(--go-fg, var(--af)); font-size: 13px; font-weight: 600; flex: none; }
.go .i { font-size: 16px; }
.go > span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .45s cubic-bezier(.2,.8,.2,1), opacity .3s, margin .45s; }
.c:hover .go > span, .c:focus-visible .go > span { max-width: 110px; opacity: 1; margin-right: 8px; }
.cg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--cg-gap, 40px 22px); }

/* rail */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, calc((100% - 60px) / 4.25)); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px 0 8px; margin-right: calc(-1 * max(var(--gr), (100vw - 1280px) / 2 + var(--gr))); padding-right: max(var(--gr), (100vw - 1280px) / 2 + var(--gr)); cursor: grab; outline-offset: 4px; }
.rail::-webkit-scrollbar { display: none; }
.rail.drag { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.rail.drag .c { pointer-events: none; }
.rail .c { scroll-snap-align: start; }
.rail-pg { height: 2px; background: var(--ln); margin-top: 32px; overflow: hidden; border-radius: 2px; }
.rail-pg span { display: block; height: 100%; width: 30%; background: var(--ink); transition: transform .2s; }
.rn { display: flex; gap: 8px; }
.rn button { width: 48px; height: 48px; border-radius: var(--rb); border: 1px solid var(--ln); background: var(--cd); color: var(--ink); display: grid; place-items: center; font-size: 18px; cursor: pointer; transition: background .3s, color .3s, transform .3s; }
.rn button:hover { background: var(--ink); color: var(--bg); }
.rn button:active { transform: scale(.94); }

/* shelf */
.shelf { display: grid; gap: 64px; }
.sf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 32px; position: relative; }
.sf::before { content: ""; position: absolute; left: -14px; right: -14px; top: 236px; height: 12px; background: var(--plank, var(--ac)); border-radius: 2px; box-shadow: 0 18px 24px -14px rgba(0,0,0,.45); z-index: 2; }
.sf .c { align-items: stretch; }
.sf .cv { height: 236px; aspect-ratio: auto; padding: 0; background: none; align-items: flex-end; perspective: 1200px; }
.sf .cv::after { display: none; }
.sf .bk { height: 210px; transform-origin: bottom center; }
.sf .bk img { filter: drop-shadow(-6px 6px 10px rgba(0,0,0,.18)); }
.sf .c:hover .bk { transform: translateY(-14px) rotateY(-14deg) rotate(-1.5deg); }
.tag { align-self: center; margin-top: 30px; position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 12px; background: var(--hl); color: var(--ink); border-radius: 4px 999px 999px 4px; font-size: 13px; transform-origin: 50% -26px; transition: transform .7s cubic-bezier(.3,1.6,.5,1); }
.tag::before { content: ""; position: absolute; left: 50%; top: -30px; height: 30px; border-left: 1.5px solid var(--ink); opacity: .45; }
.tag .cc { position: static; padding: 0; background: none; font-size: 11px; opacity: .75; }
.tag .price { font-size: 16px; }
.sf .c:hover .tag { transform: rotate(-6deg); }
.sf .cb { padding-top: 18px; text-align: center; align-items: center; }

/* row cards */
.crow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.crow .c { flex-direction: row; align-items: stretch; border: 1px solid var(--ln); border-radius: var(--r); background: var(--cd); padding: 12px; gap: 20px; transition: border-color .3s, box-shadow .4s, transform .4s; }
.crow .c:hover { border-color: var(--ink); box-shadow: 0 24px 40px -30px rgba(0,0,0,.4); transform: translateY(-2px); }
.crow .cv { flex: none; width: 124px; aspect-ratio: 124 / 150; padding: 14px; border-radius: calc(var(--r) - 4px); }
.crow .cv::after { display: none; }
.crow .bk { height: auto; width: 100%; }
.crow .bk img { width: 100%; height: auto; }
.crow .cb { padding: 4px 4px 2px 0; }
.cm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cm .cc { position: static; background: var(--ink); color: #fff; border-radius: 4px; padding: 3px 7px; }

/* index list with live preview */
.clist { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.clist .lst { border-top: 1px solid var(--ink); }
.r { display: grid; grid-template-columns: 50px 64px minmax(0, 1fr) auto 22px; align-items: center; gap: 18px; padding: 13px 6px; border-bottom: 1px solid var(--ln); transition: background .3s, padding .45s cubic-bezier(.2,.8,.2,1); }
.r .th { width: 50px; height: 62px; display: grid; place-items: center; background: var(--pa); border-radius: 4px; padding: 5px; }
.r .th img { max-height: 100%; width: auto; mix-blend-mode: multiply; }
.rc { font: 400 12px var(--fm); color: var(--mu); }
.rt { font-size: 15.5px; line-height: 1.3; }
.rk { display: block; font-size: 12px; color: var(--mu); margin-top: 3px; }
.r .price { font-size: 15px; font-weight: 500; }
.ra { opacity: 0; transform: translateX(-6px); transition: opacity .3s, transform .4s; color: var(--ai); }
.r.on { background: var(--pa); padding-left: 16px; }
